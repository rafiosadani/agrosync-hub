<!doctype html>
<html lang="id" class="theme-preload">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroSync Hub - Enterprise Database Sync & Monitoring System</title>
    <meta name="description" content="Dashboard pemantauan real-time dan manajemen database terpusat untuk AgroSync Hub enterprise multi-company database synchronization." />
    <!-- Favicon & Mobile Icons (Tersimpan Rapi di Folder /favicon/) -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon/android-chrome-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="theme-color" content="#10b981" />
    <!-- Pre-paint Theme Initializer: Mencegah kedip (FOUC) & distorsi warna skeleton saat refresh -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('agrosync_theme') || 'system';
          var resolved = stored;
          if (stored === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
          if (resolved === 'light') {
            document.documentElement.style.backgroundColor = '#f8fafc';
          } else {
            document.documentElement.style.backgroundColor = '#09090b';
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.style.backgroundColor = '#09090b';
        }
        window.addEventListener('DOMContentLoaded', function() {
          requestAnimationFrame(function() {
            document.documentElement.classList.remove('theme-preload');
          });
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
